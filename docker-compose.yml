services:
  netrunner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: netrunner
    ports:
      - "3001:3000"
    volumes:
      - netrunner_data:/app/data
      - netrunner_keys:/app/keys
      - netrunner_reports:/app/reports
      - netrunner_modules:/app/modules
      - netrunner_uploads:/app/uploads
    environment:
      - PYTHONUNBUFFERED=1
      # Обязательно для endpoint-агентов: контейнер не видит IP хост-машины,
      # без этого агентам на других хостах подсунется внутренний 172.x/127.0.0.1
      # и они не смогут достучаться до сервера. Замените на реальный адрес,
      # по которому с хостов-агентов доступен этот сервер.
      - NETRUNNER_AGENT_WS_URL=ws://192.168.1.100:3001/api/python/agent/ws
    restart: unless-stopped

volumes:
  netrunner_data:
  netrunner_keys:
  netrunner_reports:
  netrunner_modules:
  netrunner_uploads:
