services:
  netrunner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: netrunner
    ports:
      - "3001:3000"
    volumes:
      - netrunner_data:/app/data
      - netrunner_keys:/app/keys
      - netrunner_reports:/app/reports
      - netrunner_modules:/app/modules
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

volumes:
  netrunner_data:
  netrunner_keys:
  netrunner_reports:
  netrunner_modules:
